[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "verstka-sdk"
dynamic = ["version"]
description = "Python SDK for Verstka API v2: open editor sessions, verify callbacks, download and process material content (media + fonts)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Verstka" }]
keywords = ["verstka", "sdk", "editor", "cms", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
flask = ["flask>=3.0"]
django = ["django>=4.2"]
drf = ["django>=4.2", "djangorestframework>=3.15"]
all = [
    "fastapi>=0.110",
    "flask>=3.0",
    "django>=4.2",
    "djangorestframework>=3.15",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "fastapi>=0.110",
    "flask>=3.0",
    "django>=4.2",
    "djangorestframework>=3.15",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/verstka/verstka-sdk-python"
Issues = "https://github.com/verstka/verstka-sdk-python/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/verstka_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "src/verstka_sdk",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
packages = ["verstka_sdk"]
